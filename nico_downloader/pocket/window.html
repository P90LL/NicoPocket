<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoPocket</title>
  <link rel="stylesheet" href="./window.css" />
  <script src="./title.js" defer></script>
  <script src="./metadata.js" defer></script>
  <script src="./artwork.js" defer></script>
  <script src="./window.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="titlebar">
    <div class="brand"><img src="./logo.svg" alt="" width="36" height="36" /><span><strong>NicoPocket</strong><small>にこぽけ</small></span></div>
    <div class="titlebar-center"><span class="development-badge">NicoPocket · 個人利用版</span></div>
    <button id="close-editor" class="secondary" type="button">閉じる</button>
  </header>
  <main>
    <div class="review-layout">
      <section class="card review-main" aria-labelledby="title-heading">
        <div class="section-heading"><div><h2 id="title-heading">保存内容</h2><p id="video-status" role="status">動画情報を読み込んでいます…</p></div></div>
        <dl class="video-details"><div><dt>動画ID</dt><dd id="video-id">—</dd></div><div><dt>投稿者</dt><dd id="video-uploader">—</dd></div></dl>
        <div class="original-title"><span class="subtle">元タイトル</span><p id="original-title">—</p></div>
        <div id="draft-editor">
          <label for="draft-title">保存タイトル / ファイル名</label>
          <div class="input-suffix"><input id="draft-title" type="text" maxlength="500" autocomplete="off" placeholder="タイトルを入力" /><span>.m4a</span></div>
          <div id="draft-options">
            <label for="audio-quality">音質</label>
            <select id="audio-quality" name="quality"><option value="standard" selected>標準音質</option><option value="high">高音質</option></select>
            <p id="audio-info" class="subtle">標準音質は192 kbps基準。高音質は取得可能な元音源を使用します。</p>
          </div>
        </div>
        <details class="metadata-summary"><summary>保存するメタデータ</summary><dl id="metadata-preview"></dl></details>
      </section>
      <div class="artwork-column">
      <aside class="card cover-summary" aria-labelledby="artwork-heading">
        <div class="section-heading"><h2 id="artwork-heading">Artwork</h2><span id="artwork-state" class="status-pill">未設定</span></div>
        <div class="cover-preview"><img id="artwork-image" alt="現在の動画のサムネイル" referrerpolicy="no-referrer" hidden /><span id="artwork-empty">サムネイル未取得</span></div>
        <p id="artwork-note">元のサムネイルです。1:1の正方形に編集できます。</p>
        <button id="artwork-edit" class="secondary full" type="button" disabled>Artworkを編集</button>
      </aside>
      <div class="action-row download-actions"><button id="download" class="primary full" type="button" aria-describedby="save-status" disabled>Download</button><button id="cancel-download" class="secondary full" type="button" hidden>キャンセル</button></div>
      <progress id="download-progress" max="100" hidden aria-label="ダウンロード進捗"></progress>
      <p id="save-status" class="subtle" role="status">M4Aとして保存します。</p>
      </div>
    </div>
  </main>
</div>
<dialog id="artwork-dialog" aria-labelledby="artwork-dialog-title">
  <h2 id="artwork-dialog-title">Artworkを編集</h2>
  <p class="subtle">固定1:1 · 画像をドラッグして位置を調整</p>
  <div class="artwork-stage">
    <canvas id="artwork-background" width="1200" height="768" aria-hidden="true"></canvas>
    <canvas id="artwork-canvas" width="768" height="768" tabindex="0" aria-label="明るい正方形が最終Artwork。ドラッグまたは矢印キーで位置を調整"></canvas>
  </div>
  <label for="artwork-zoom">ズーム <output id="artwork-zoom-value" for="artwork-zoom">100%</output></label>
  <input id="artwork-zoom" type="range" min="1" max="4" step="0.01" value="1" />
  <p id="artwork-edit-status" class="subtle" role="status"></p>
  <div class="action-row">
    <button id="artwork-reset" class="secondary" type="button">リセット</button>
    <button id="artwork-cancel" class="secondary" type="button">キャンセル</button>
    <button id="artwork-apply" class="primary" type="button">適用</button>
  </div>
</dialog>
</body>
</html>
