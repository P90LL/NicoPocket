<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NicoPocket</title>
  <link rel="stylesheet" href="./window.css" />
  <script src="./window.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="titlebar">
    <div class="brand"><img src="./logo.svg" alt="" width="36" height="36" /><span><strong>NicoPocket</strong><small>にこぽけ</small></span></div>
    <div class="titlebar-center"><span class="development-badge">開発中 · 保存機能は準備中</span></div>
    <button id="close-editor" class="secondary" type="button">閉じる</button>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">EDIT WINDOW</p><h1>保存内容を編集</h1><p>タイトル・Artwork・音質を確認します。</p></div></div>
    <div class="review-layout">
      <section class="card review-main" aria-labelledby="title-heading">
        <div class="section-heading"><div><h2 id="title-heading">保存内容</h2><p>動画情報の読み込みは準備中です。</p></div></div>
        <div id="draft-editor">
          <label for="draft-title">タイトル / ファイル名</label>
          <div class="input-suffix"><input id="draft-title" type="text" maxlength="500" autocomplete="off" placeholder="タイトルを入力" /><span>.m4a</span></div>
          <div id="draft-options">
            <label for="audio-quality">音質</label>
            <select id="audio-quality" name="quality"><option value="standard" selected>標準音質</option><option value="high">高音質</option></select>
          </div>
        </div>
      </section>
      <aside class="card cover-summary" aria-labelledby="artwork-heading">
        <div class="section-heading"><h2 id="artwork-heading">Artwork</h2><span class="status-pill">未設定</span></div>
        <div class="cover-preview"><span>Artworkプレビュー<br>1:1の正方形</span></div>
        <p>画像の読み込み・トリミングは準備中です。</p>
        <button class="secondary full" type="button" disabled>Artworkを編集（準備中）</button>
      </aside>
    </div>
    <div class="action-row"><button id="download" class="primary" type="button" aria-describedby="save-status" disabled>Download</button></div>
    <p id="save-status" class="subtle" role="status">保存機能は準備中です。</p>
  </main>
</div>
</body>
</html>
